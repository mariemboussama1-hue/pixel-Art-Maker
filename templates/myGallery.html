<!DOCTYPE html>
<html lang="en">

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styleGal.css') }}"
    />
    <title>Document</title>

      <div class="header-title1">Pixel Art Maker</div>
      <div class="header-title2">YOUR DIGITAL ART STUDIO</div>
